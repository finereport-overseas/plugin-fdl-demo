import org.gradle.plugins.ide.idea.model.IdeaLanguageLevel

plugins {
    id 'java'
    id 'java-library'
    id 'idea'
}

/**
 * 可以修改这个变量以依赖不同的开发版本
 */
def fineVersion = '11.0-RELEASE-SNAPSHOT'
def fdlVersion = '5.0-RELEASE-SNAPSHOT'
def fdlThirdVersion = '5.0-RELEASE-SNAPSHOT'
def fdlWebUIVersion = '5.0-RELEASE-SNAPSHOT'
def fineDatasourceVersion = '5.0-RELEASE-SNAPSHOT'

group = 'com.fr.plugin'
version = '11.0'

ext {
    /**
     * 是否对插件的class进行加密保护，防止反编译
     */
    guard = false

    def pluginInfo = getPluginInfo()
    pluginPre = "fine-plugin"
    pluginName = pluginInfo.id
    pluginVersion = pluginInfo.version

    outputPath = prepareOutputPath(pluginName, pluginVersion)
}

ant.importBuild("encrypt.xml")
//定义ant变量
ant.projectDir = projectDir
ant.references["compile.classpath"] = ant.path {
    fileset(dir: "./lib",includes:"**/*.jar" )
}

classes.dependsOn('clean')

task copyFiles(type: Copy,dependsOn: 'classes'){
    from outputPath
    into "$projectDir/classes"
}

task preJar(type:Copy,dependsOn: guard ? 'compile_encrypt_javas' : 'compile_plain_javas'){
    from "$projectDir/classes"
    into "$projectDir/transform-classes"
    include "**/*.*"
}
jar.dependsOn("preJar")

task makeJar(type: Jar,dependsOn: preJar){
    from fileTree(dir: "$projectDir/transform-classes")

    subprojects.each { subproject ->
        dependsOn "${subproject.path}:processResources"
        from("${subproject.buildDir}/classes/java/main")
        from("${subproject.buildDir}/resources/main")
    }

    archiveBaseName = pluginPre
    archiveAppendix = pluginName
    archiveVersion = pluginVersion
    destinationDirectory = file("$buildDir/libs")

    doLast(){
        delete file("$projectDir/classes")
        delete file("$projectDir/transform-classes")
    }
}

task copyFile(type: Copy,dependsOn: ["makeJar"]){
    from "$buildDir/libs"
    from("$projectDir/lib") {
        include "*.jar"
    }
    from "$projectDir/plugin.xml"
    into file("$buildDir/temp/plugin")
}

task zip(type:Zip,dependsOn:["copyFile"]){
    from "$buildDir/temp/plugin"
    destinationDirectory = file("$buildDir/install")
    archiveBaseName = pluginPre
    archiveAppendix = pluginName
    archiveVersion = pluginVersion
}

//控制build时包含哪些文件,排除哪些文件
processResources {
//    exclude everything
//    用*.css没效果
//    exclude '**/*.css'
//    except this file
//    include 'xx.xml'
}

def getPluginInfo() {
    def xmlFile = file("plugin.xml")
    if (!xmlFile.exists()) {
        return ["id": "none", "version": "1.0.0"]
    }
    def plugin = new XmlParser().parse(xmlFile)
    def version = plugin.version[0].text()
    def id = plugin.id[0].text()
    return ["id": id, "version": version]
}

def prepareOutputPath(String pluginName, String pluginVersion) {
    String plugins = "$projectDir/../env/WEB-INF/plugins/"
    String prefix = "plugin-$pluginName-"
    String pluginDir = prefix + pluginVersion
    mkdir(plugins)
    file(plugins).eachDir { File it ->
        if (it.name.startsWith(prefix) && pluginDir != it.name) {
            println "delete old plugin directory " + it.name
            delete it
        }
    }
    copy {
        from "$projectDir/plugin.xml"
        into plugins + pluginDir
    }
    String libDirPath = plugins + pluginDir + "/lib"
    delete libDirPath
    copy {
        from fileTree(dir: "$projectDir/lib", includes: ["*.jar"])
        into libDirPath
    }
    return "${plugins}${pluginDir}/classes"
}

